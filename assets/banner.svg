<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MIAVRO Systems – Liaqat Ali Khan, Full Stack Engineer">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f6bff"/><stop offset="1" stop-color="#5a38f0"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8ccff"/><stop offset="0.55" stop-color="#8f6bff"/><stop offset="1" stop-color="#3de8c4"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f6bff" stop-opacity="0"/><stop offset="0.5" stop-color="#8f6bff"/><stop offset="1" stop-color="#3de8c4" stop-opacity="0"/></linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#5a38f0" stop-opacity=".55"/><stop offset="1" stop-color="#5a38f0" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#3de8c4" stop-opacity=".30"/><stop offset="1" stop-color="#3de8c4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/></pattern>
    <clipPath id="card"><rect width="1280" height="440" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="#06060c"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <circle cx="260" cy="120" r="320" fill="url(#o1)"><animateTransform attributeName="transform" type="translate" values="0 0;90 40;0 0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="380" r="300" fill="url(#o2)"><animateTransform attributeName="transform" type="translate" values="0 0;-110 -50;0 0" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="200" fill="url(#o1)" opacity=".6"><animateTransform attributeName="transform" type="translate" values="0 0;-60 60;0 0" dur="18s" repeatCount="indefinite"/></circle>
    <rect y="-80" width="1280" height="80" fill="url(#edge)" opacity=".10"><animate attributeName="y" values="-80;440" dur="7s" repeatCount="indefinite"/></rect>
  </g>
  <rect x=".5" y=".5" width="1279" height="439" rx="21.5" stroke="#ffffff" stroke-opacity=".10"/>

  <!-- brand mark -->
  <g transform="translate(72 64)">
    <rect width="64" height="64" rx="16" fill="#fff"/>
    <path d="M17 46V19h6.2l8.8 14.6L40.8 19H47v27h-5.6V28.8l-7.7 12.4h-3.4l-7.7-12.4V46z" fill="#0b0b14"/>
    <text x="84" y="31" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff" letter-spacing="1">MIAVRO<tspan font-weight="300" fill="#cfc4ff"> Systems</tspan></text>
    <text x="85" y="54" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8e8aa8" letter-spacing="3">AI · WEB · AUTOMATION</text>
  </g>

  <!-- headline -->
  <text x="72" y="190" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="#fff" letter-spacing="-1.5">AI-powered websites &amp; apps,</text>
  <text x="72" y="256" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="url(#hl)" letter-spacing="-1.5">engineered for speed and SEO.</text>

  <!-- rotating line -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="19" fill="#3de8c4">
    <text x="72" y="306" opacity="0">&gt; Full Stack Engineer<animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;.04;.22;.26;.5;.75;.9;.96;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="72" y="306" opacity="0">&gt; AI Web Developer<animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;.24;.26;.3;.47;.5;.75;.96;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="72" y="306" opacity="0">&gt; WordPress &amp; WooCommerce<animate attributeName="opacity" values="0;0;0;0;0;1;1;0;0" keyTimes="0;.49;.5;.52;.54;.55;.72;.76;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="72" y="306" opacity="0">&gt; Next.js · React · Automation<animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;.74;.76;.78;.80;.95;.98;1" dur="12s" repeatCount="indefinite"/></text>
    <rect x="72" y="316" width="3" height="0" fill="#3de8c4"/>
  </g>

  <!-- chips -->
  <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#d9d4f5">
    <g transform="translate(72 350)"><rect width="214" height="44" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#8f6bff" stroke-opacity=".5"/><circle cx="24" cy="22" r="4" fill="#8f6bff"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle><text x="40" y="27">AI Web Development</text></g>
    <g transform="translate(302 350)"><rect width="128" height="44" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#8f6bff" stroke-opacity=".5"/><circle cx="24" cy="22" r="4" fill="#3de8c4"><animate attributeName="r" values="3;5;3" dur="2.4s" begin=".4s" repeatCount="indefinite"/></circle><text x="40" y="27">Next.js</text></g>
    <g transform="translate(446 350)"><rect width="140" height="44" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#8f6bff" stroke-opacity=".5"/><circle cx="24" cy="22" r="4" fill="#8f6bff"><animate attributeName="r" values="3;5;3" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle><text x="40" y="27">WordPress</text></g>
    <g transform="translate(602 350)"><rect width="150" height="44" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#8f6bff" stroke-opacity=".5"/><circle cx="24" cy="22" r="4" fill="#3de8c4"><animate attributeName="r" values="3;5;3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle><text x="40" y="27">Automation</text></g>
  </g>
  <text x="1208" y="404" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#6f6a8c" letter-spacing="1.5">miavrosystems.com</text>
  <text x="1208" y="76" text-anchor="end" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#a9a3c9" font-weight="600">Liaqat Ali Khan</text>
  <text x="1208" y="98" text-anchor="end" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6f6a8c">Founder &amp; Full Stack Engineer</text>
</svg>
